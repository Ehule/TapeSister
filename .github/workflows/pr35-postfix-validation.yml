name: PR35 repaired-head validation

on:
  push:
    branches:
      - agent/external-input-rec-bank

permissions:
  contents: write

jobs:
  linux:
    if: ${{ !contains(github.event.head_commit.message, '[pr35-validation-trigger]') && !contains(github.event.head_commit.message, '[pr35-windows-validated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/external-input-rec-bank
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev ninja-build
      - name: Build with Make
        run: make -j2
      - name: CMake Release and full tests
        run: |
          cmake -S . -B build-validation-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-validation-linux -j2
          ctest --test-dir build-validation-linux --output-on-failure
      - name: Repeated Sample/REC bank stress with missing capture device
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ./build-validation-linux/tapesister --diagnostic-bank-toggle-stress

  windows-ucrt64:
    if: ${{ !contains(github.event.head_commit.message, '[pr35-validation-trigger]') && !contains(github.event.head_commit.message, '[pr35-windows-validated]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/external-input-rec-bank
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-SDL2
      - name: UCRT64 Release build and full tests
        shell: msys2 {0}
        run: |
          cmake -S . -B build-validation-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-DSDL_MAIN_HANDLED"
          cmake --build build-validation-release -j2
          ctest --test-dir build-validation-release --output-on-failure
          echo "Windows PE stack reservation:"
          objdump -x build-validation-release/tapesister.exe | grep -i -E "SizeOfStackReserve|SizeOfStackCommit"
      - name: UCRT64 Release repeated 1/1-equivalent bank stress and missing-input failure
        shell: msys2 {0}
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ./build-validation-release/tapesister.exe --diagnostic-bank-toggle-stress
      - name: UCRT64 Debug build and focused tests
        shell: msys2 {0}
        run: |
          cmake -S . -B build-validation-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-DSDL_MAIN_HANDLED"
          cmake --build build-validation-debug -j2
          ctest --test-dir build-validation-debug -R "external_record|capture|bank" --output-on-failure -V
      - name: UCRT64 Debug repeated 1/1-equivalent bank stress and missing-input failure
        shell: msys2 {0}
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ./build-validation-debug/tapesister.exe --diagnostic-bank-toggle-stress
      - name: Mark UCRT64 success on branch
        shell: msys2 {0}
        run: |
          git config user.name "TapeSister UCRT64 validation"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "test: UCRT64 Release and Debug validate PR35 repair [pr35-windows-validated]"
          git push origin HEAD:agent/external-input-rec-bank
