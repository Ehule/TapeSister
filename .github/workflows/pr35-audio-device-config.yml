name: PR35 audio device Config integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/external-input-rec-bank

permissions:
  contents: write

jobs:
  implement-linux:
    if: ${{ github.event_name == 'pull_request' || (!contains(github.event.head_commit.message, '[pr35-audio-device-config]') && !contains(github.event.head_commit.message, '[pr35-audio-device-windows-validated]') && !contains(github.event.head_commit.message, '[pr35-audio-device-diagnostic]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/external-input-rec-bank
          fetch-depth: 0
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev ninja-build
      - name: Apply and validate implementation
        id: validate
        shell: bash
        run: |
          set +e
          (
            echo '=== APPLY PATCH ===' &&
            python3 tools/pr35_audio_device_config.py &&
            echo '=== PRESERVE UI HELPERS / FIX C LITERALS ===' &&
            python3 tools/pr35_audio_device_fixup.py &&
            echo '=== MAKE BUILD ===' &&
            make -j2 &&
            echo '=== MAKE TEST ===' &&
            make test &&
            echo '=== CMAKE RELEASE ===' &&
            cmake -S . -B build-pr35-audio-linux -G Ninja -DCMAKE_BUILD_TYPE=Release &&
            cmake --build build-pr35-audio-linux -j2 &&
            ctest --test-dir build-pr35-audio-linux --output-on-failure &&
            echo '=== REC BANK STRESS ===' &&
            SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./build-pr35-audio-linux/tapesister --diagnostic-bank-toggle-stress
          ) > pr35-audio-device-validation.log 2>&1
          status=$?
          cat pr35-audio-device-validation.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit diagnostic on failure
        if: steps.validate.outputs.status != '0'
        run: |
          git config user.name "TapeSister PR35 audio Config"
          git config user.email "actions@users.noreply.github.com"
          git add pr35-audio-device-validation.log
          git commit -m "test: capture PR35 audio device Config failure [pr35-audio-device-diagnostic]" || true
          git push origin HEAD:agent/external-input-rec-bank
          exit 1
      - name: Remove temporary implementation machinery
        if: steps.validate.outputs.status == '0'
        run: |
          rm -f tools/pr35_audio_device_config.py
          rm -f tools/pr35_audio_device_fixup.py
          rm -f .github/workflows/pr35-audio-device-config.yml
          rm -f tools/pr35_audio_device_trigger.txt
          rm -f pr35-audio-device-validation.log
      - name: Commit implementation
        if: steps.validate.outputs.status == '0'
        run: |
          git config user.name "TapeSister PR35 audio Config"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add SDL input and output device selectors to Config [pr35-audio-device-config]"
          git push origin HEAD:agent/external-input-rec-bank

  windows-ucrt64:
    needs: implement-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/external-input-rec-bank
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-SDL2
      - name: UCRT64 Release build and tests
        shell: msys2 {0}
        run: |
          cmake -S . -B build-ucrt-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-DSDL_MAIN_HANDLED"
          cmake --build build-ucrt-release -j2
          ctest --test-dir build-ucrt-release --output-on-failure
          objdump -x build-ucrt-release/tapesister.exe | grep -i -E "SizeOfStackReserve|SizeOfStackCommit" || true
      - name: UCRT64 Release REC-bank stress
        shell: msys2 {0}
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ./build-ucrt-release/tapesister.exe --diagnostic-bank-toggle-stress
      - name: UCRT64 Debug build and focused tests
        shell: msys2 {0}
        run: |
          cmake -S . -B build-ucrt-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-DSDL_MAIN_HANDLED"
          cmake --build build-ucrt-debug -j2
          ctest --test-dir build-ucrt-debug -R "external_record|capture|bank|core" --output-on-failure -V
      - name: Mark Windows validation success
        if: github.event_name == 'push'
        shell: msys2 {0}
        run: |
          git config user.name "TapeSister UCRT64 validation"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "test: UCRT64 validates PR35 audio device Config [pr35-audio-device-windows-validated]"
          git push origin HEAD:agent/external-input-rec-bank
