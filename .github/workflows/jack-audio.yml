name: JACK audio
on:
  pull_request:
    paths:
      - 'src/main_sdl_jack.inc'
      - 'tests/test_jack_backend.c'
      - 'tests/test_jack_router.inc'
      - 'src/*router*'
      - 'include/tapesister/router.h'
      - '.github/workflows/jack-audio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jack-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JACK_NO_AUDIO_RESERVATION: '1'
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - name: Install audio test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev jackd2
      - name: Compile and test native endpoint lifecycle
        run: |
          cmake -S . -B build-jack -DCMAKE_BUILD_TYPE=Release -DTAPESISTER_BUNDLE_CDP8=OFF -DTAPESISTER_ENABLE_MIDI=OFF
          cmake --build build-jack --target tapesister_jack_backend_tests -j 2
          build-jack/tapesister_jack_backend_tests
      - name: Route stereo Send into Return through JACK
        run: |
          jackd --no-realtime -d dummy -r 48000 -p 128 > /tmp/jack.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; cat /tmp/jack.log' EXIT
          for attempt in $(seq 1 50); do
            if jack_lsp >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          build-jack/tapesister_jack_backend_tests --live
