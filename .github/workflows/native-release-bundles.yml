name: Native release bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libasound2-dev ninja-build
      - name: Configure bundled release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTAPESISTER_BUNDLE_CDP8=ON
      - name: Build TapeSister, tests, and CDP8
        run: cmake --build build
      - name: Run regression suite
        run: ctest --test-dir build --output-on-failure
      - name: Assemble archive
        run: tar -C build -czf TapeSister-linux-x86_64.tar.gz tapesister assets cdp licenses tapesister.ini.example
      - uses: actions/upload-artifact@v4
        with:
          name: TapeSister-linux-x86_64
          path: TapeSister-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
      - name: Configure bundled release
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTAPESISTER_BUNDLE_CDP8=ON
      - name: Build TapeSister, tests, and CDP8
        shell: msys2 {0}
        run: cmake --build build
      - name: Run regression suite
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
      - name: Assemble archive
        shell: pwsh
        run: Compress-Archive -Path build/tapesister.exe,build/*.dll,build/assets,build/cdp,build/licenses,build/tapesister.ini.example -DestinationPath TapeSister-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TapeSister-windows-x86_64
          path: TapeSister-windows-x86_64.zip
