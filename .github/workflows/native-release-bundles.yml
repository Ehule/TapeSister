name: Native release bundles

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-release-bundles.yml"
      - "src/ts_transient.c"
      - "include/tapesister/transient.h"
      - "tests/test_transient*.c"
      - "tests/test_new_project.c"
      - "tests/test_pedalboard_slots.c"
      - "src/main_sdl_pedalboard.inc"
      - "tests/test_linux_startup.py"
      - "src/main_sdl_project.inc"
      - "src/*compressor*"
      - "include/tapesister/compressor.h"
      - "tests/test_compressor*"
      - "src/*master_eq*"
      - "include/tapesister/master_eq.h"
      - "tests/test_master_eq*"
      - "src/*mandala*"
      - "include/tapesister/mandala*.h"
      - "tests/test_mandala*.c"
      - "CMakeLists.txt"
      - "build.sh"
      - "cmake/**"
      - "scripts/**"
      - "src/tapesister.rc.in"
      - "src/*keyboard_sequence*"
      - "src/*tracker*"
      - "include/tapesister/*tracker*"
      - "tests/test_tracker*.c"
      - "tests/test_tapehead*.c"
      - "src/*tapehead*"
      - "include/tapesister/tapehead_embed.h"
      - "src/*source_route*"
      - "src/*matrix*"
      - "include/tapesister/routing_matrix.h"
      - "tests/test_matrix_controller.inc"
      - "tests/test_routing_matrix.c"
      - "src/*clean_output*"
      - "include/tapesister/*route*.h"
      - "include/tapesister/clean_output.h"
      - "tests/test_source_route*.c"
      - "src/*spatial*"
      - "include/tapesister/spatial*.h"
      - "tests/test_spatial*.c"
      - "src/ts_sample.c"
      - "src/*fm*"
      - "tests/test_fm*"
      - "src/ts_sample_pages.c"
      - "src/ts_tile_id.c"
      - "include/tapesister/sample*.h"
      - "include/tapesister/tile_id.h"
      - "src/ts_note_bank.c"
      - "src/ts_performance.c"
      - "src/ts_sister_*.c"
      - "include/tapesister/voice_handoff.h"
      - "include/tapesister/note_bank.h"
      - "include/tapesister/performance.h"
      - "include/tapesister/sister_*.h"
      - "tests/*realtime*"
      - "tests/test_sister_*.c"
      - "tests/test_note_bank_stereo.c"
      - "tests/test_performance_stereo.c"
      - "src/main_sdl.c"
      - "src/*palette*"
      - "src/*theme*"
      - "include/tapesister/palette.h"
      - "include/tapesister/theme.h"
      - "tests/test_palette*.c"
      - "tests/test_theme.c"
      - "src/main_sdl_audio*.inc"
      - "src/ts_realtime_diagnostics.c"
      - "include/tapesister/realtime_diagnostics.h"
      - "src/ts_asio_backend.cpp"
      - "src/ts_asio_callback_lock.h"
      - "include/tapesister/asio_backend.h"
      - "tests/test_audio_health.c"
      - "tests/test_asio_backend.cpp"
      - "tests/test_audio_reconfigure.c"
      - "tests/asio_fixture/**"
      - "src/main_sdl_wheel.inc"
      - "src/ts_ui.c"
      - "tests/test_wheel_controller.inc"
      - "tests/test_core.c"
      - "src/ts_performance_help.inc"
      - "include/tapesister/keyboard_sequence.h"
      - "include/tapesister/ui.h"
      - "tests/*keyboard*"
      - "assets/**"
      - "release/**"
      - "third_party/**"
  push:
    tags:
      - "v*"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libasound2-dev ninja-build
      - name: Configure bundled release
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTAPESISTER_BUNDLE_CDP8=ON
      - name: Build TapeSister, tests, and CDP8
        run: cmake --build build
      - name: Run audio, keyboard, Insert and Router regression tests
        run: ctest --test-dir build --output-on-failure -R 'profile|pedalboard_slots|new_project|transient|sister_ui_model|sister_source_ui|sister_capture_ui|theme_tests|palette_window|sister_palette|compressor|mandala|routing_matrix|source_route|spatial|jack_backend|asio|audio_reconfigure|audio_lifecycle|audio_config|insert_tests|router|master_eq|tile_eq|mosaic|native_waveform|render_efficiency|test_prism|keyboard_hold|keyboard_sequence|sister_tracker|tracker_playback|tracker_edit|tracker_controller|tapehead_embedded|quick_capture|sample_pages|sister_project_state|core_tests|fm_directions|fm_unison|capture_tests|midi_tests|performance_tests|preview_loop|realtime_edits|realtime_controller|realtime_diagnostics|audio_health|sister_post_fx|sister_modulation|sister_routes|note_bank_stereo|performance_stereo'
      - name: Run package regression guard
        if: github.event_name == 'pull_request'
        run: ctest --test-dir build --output-on-failure -R test_identity_packaging
      - name: Run full release regression suite
        if: github.event_name != 'pull_request'
        run: ctest --test-dir build --output-on-failure
      - name: Assemble archive
        run: |
          tar -czf TapeSister-linux-x86_64.tar.gz -C build tapesister assets cdp licenses tapesister.ini.example \
            -C .. docs README.md THIRD_PARTY_NOTICES.md -C release PORTABLE_README.txt
          tar -tzf TapeSister-linux-x86_64.tar.gz > archive-contents.txt
          for required in docs/USER_MANUAL.md docs/QUICK_REFERENCE.md docs/ROUTING_MATRIX.md docs/ASIO_AUDIO.md docs/LEGACY_ROUTING.md docs/screenshots/routing-matrix/matrix-signal-activity.png; do
            grep -Fxq "$required" archive-contents.txt || exit 1
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: linux-artifact
        with:
          path: TapeSister-linux-x86_64.tar.gz
          archive: false
          if-no-files-found: error
      - name: Download the exact user-facing tar archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.linux-artifact.outputs.artifact-id }}
          path: download-check
      - name: Verify direct Linux download and executable permissions
        run: |
          cmp TapeSister-linux-x86_64.tar.gz download-check/TapeSister-linux-x86_64.tar.gz
          mkdir download-check/extracted
          tar -xzf download-check/TapeSister-linux-x86_64.tar.gz -C download-check/extracted
          test -x download-check/extracted/tapesister
          for program in build/cdp/bin/*; do
            test -x "download-check/extracted/cdp/bin/$(basename "$program")" || exit 1
          done
      - name: Launch the downloaded Linux executable with a desktop stack limit
        run: python3 tests/test_linux_startup.py download-check/extracted/tapesister

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
      - name: Configure bundled release
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTAPESISTER_BUNDLE_CDP8=ON
      - name: Build TapeSister, tests, and CDP8
        shell: msys2 {0}
        run: cmake --build build
      - name: Run audio, keyboard, Insert and Router regression tests
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure -R 'profile|pedalboard_slots|new_project|transient|sister_ui_model|sister_source_ui|sister_capture_ui|theme_tests|palette_window|sister_palette|compressor|mandala|routing_matrix|source_route|spatial|jack_backend|asio|audio_reconfigure|audio_lifecycle|audio_config|insert_tests|router|master_eq|tile_eq|mosaic|native_waveform|render_efficiency|test_prism|keyboard_hold|keyboard_sequence|sister_tracker|tracker_playback|tracker_edit|tracker_controller|tapehead_embedded|quick_capture|sample_pages|sister_project_state|core_tests|fm_directions|fm_unison|capture_tests|midi_tests|performance_tests|preview_loop|realtime_edits|realtime_controller|realtime_diagnostics|audio_health|sister_post_fx|sister_modulation|sister_routes|note_bank_stereo|performance_stereo'
      - name: Run package regression guard
        if: github.event_name == 'pull_request'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure -R test_identity_packaging
      - name: Run full release regression suite
        if: github.event_name != 'pull_request'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
      - name: Assemble archive
        shell: pwsh
        run: ./scripts/package-windows-portable.ps1 -BuildDirectory build -OutputDirectory .
      - name: Verify ZIP metadata and Windows shell extraction
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/test_windows_portable.ps1 -ArchivePath TapeSister-Windows-x64.zip -StagingDirectory TapeSister-Windows-x64
      # Send our ZIP unchanged; do not put it inside a second artifact ZIP.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: windows-artifact
        with:
          path: TapeSister-Windows-x64.zip
          archive: false
          if-no-files-found: error
      - name: Download the exact user-facing ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.windows-artifact.outputs.artifact-id }}
          path: download-check
          skip-decompress: true
      - name: Verify one-extraction downloaded package
        shell: pwsh
        timeout-minutes: 5
        run: |
          $Downloaded = 'download-check/TapeSister-Windows-x64.zip'
          if ((Get-FileHash TapeSister-Windows-x64.zip).Hash -ne (Get-FileHash $Downloaded).Hash) {
            throw 'Downloaded archive differs from the packaged ZIP'
          }
          ./tests/test_windows_portable.ps1 -ArchivePath $Downloaded -StagingDirectory TapeSister-Windows-x64 -MarkDownloaded
